<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Entregador - Incidentes</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body class="bg-light">

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="/entregador">Entregador</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="/entregador">Minhas Entregas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/entregador/incidentes">Incidentes</a>
                        </li>
                    </ul>
                    <div class="d-flex">
                        <a href="/sair" class="btn btn-outline-light btn-sm">Sair</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container mt-5 mb-5">
            <h2 class="mb-1 fw-bold">Registro de Incidentes</h2>
            <p class="text-muted mb-4">Registre ocorrências apenas nas entregas atribuídas a você</p>
            <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>
            <div th:if="${erroServidor}" class="alert alert-danger" th:text="${erroServidor}"></div>
            <hr class="mb-4">

            <div class="card shadow-sm mb-5">
                <div class="card-body">
                    <form th:action="@{/entregador/incidentes}" method="post">
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Minha Entrega</label>
                                <select class="form-select" name="id_pedido" required>
                                    <option value="" disabled selected>Selecione uma entrega...</option>
                                    <option th:each="pedido : ${pedidos}"
                                            th:value="${pedido.id_pedido}"
                                            th:text="${pedido.nome_pedido}">
                                    </option>
                                </select>
                                <div class="form-text" th:if="${#lists.isEmpty(pedidos)}">
                                    Você não possui entregas atribuídas no momento.
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Tipo</label>
                                <select class="form-select" name="tipo" required>
                                    <option value="">Selecione o tipo</option>
                                    <option value="Problema no Caminhão">Problema no Caminhão</option>
                                    <option value="Problema no Produto">Problema no Produto</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Descrição</label>
                                <input type="text" class="form-control" name="descricao" placeholder="Ex: Pneu furado na BR-101">
                            </div>
                        </div>
                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-dark" th:disabled="${#lists.isEmpty(pedidos)}">Registrar Incidente</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Lote</th>
                                <th>Tipo</th>
                                <th>Descrição</th>
                                <th>Data e Horário</th>
                                <th>Nome do Entregador</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="incidente : ${incidentes}">
                                <td th:text="${incidente.tipo}"></td>
                                <td th:text="${incidente.descricao}"></td>
                                <td th:text="${incidente.acao_tomada}"></td>
                                <td th:text="${#temporals.format(incidente.data_ocorrencia, 'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${incidente.nome_entregador}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(incidentes)}">
                                <td colspan="5" class="text-center text-muted py-4">Nenhum incidente registrado ainda</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
