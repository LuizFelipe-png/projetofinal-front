    <html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Incidentes</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="/industria">Indústria</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="/industria">Lotes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/novo-lote">Novo Lote</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/industria/incidentes">Incidentes</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="container mt-5 mb-5">
            <h2 class="mb-1">Incidentes</h2>
            <p class="text-muted mb-4">Registre problemas ocorridos com caminhões ou produtos durante o transporte</p>
            <hr class="mb-4">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h5 class="card-title mb-3">Registrar Novo Incidente</h5>
                    <form th:action="@{/industria/incidentes}" th:object="${incidente}" method="post">
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Lote</label>
                                <select class="form-select" th:field="*{id_pedido}" required>
                                    <option value="">Selecione um lote</option>
                                    <option th:each="lote : ${lotes}" th:value="${lote.id_pedido}" th:text="${lote.codigo} + ' - ' + ${lote.nome_pedido}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Tipo</label>
                                <select class="form-select" th:field="*{tipo}" required>
                                    <option value="">Selecione o tipo</option>
                                    <option value="Problema no Caminhão">Problema no Caminhão</option>
                                    <option value="Problema no Produto">Problema no Produto</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Descrição</label>
                                <input type="text" class="form-control" th:field="*{descricao}" placeholder="Ex: Pneu furado na BR-101">
                            </div>
                        </div>
                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary">Registrar Incidente</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Lote</th>
                                <th>Tipo</th>
                                <th>Descrição</th>
                                <th>Ação Tomada</th>
                                <th>Data</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="incidente : ${incidentes}">
                                <td><strong th:text="${incidente.codigo_pedido}"></strong></td>
                                <td th:text="${incidente.tipo}"></td>
                                <td th:text="${incidente.descricao}"></td>
                                <td th:text="${incidente.acao_tomada}"></td>
                                <td th:text="${#temporals.format(incidente.data_ocorrencia, 'dd/MM/yyyy HH:mm')}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(incidentes)}">
                                <td colspan="5" class="text-center text-muted py-4">Nenhum incidente registrado ainda</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </body>
</html>
