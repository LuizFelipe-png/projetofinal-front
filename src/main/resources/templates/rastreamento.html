<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Rastreamento</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/">Cliente</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/rastreamento">Rastrear Encomenda</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="container mt-5 mb-5">
            <h2 class="mb-3">Rastreamento de Encomenda</h2>
            <p class="text-muted mb-4">Digite o código do lote para consultar o status da sua entrega.</p>
            <form class="row g-2 mb-5" action="/rastreamento" method="get">
                <div class="col-9">
                    <input type="text" class="form-control" name="codigoLote" th:value="${codigoLote}" placeholder="Ex: ABC12" required>
                </div>
                <div class="col-3">
                    <button class="btn btn-primary w-100" type="submit">Buscar</button>
                </div>
            </form>
            <div th:if="${erro}" class="alert alert-warning" th:text="${erro}"></div>
            <div th:if="${pedido != null}">
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="card-title mb-0" th:text="${'Codigo do pedido: ' + pedido.codigo}"></h5>
                            <span th:class="${pedido.status == 'Entregue' ? 'badge bg-success' : 'badge bg-warning text-dark'}"
                                  th:text="${pedido.status}"></span>
                        </div>
                        <p class="card-text text-muted mb-0 mt-2" th:text="${pedido.nome_pedido}"></p>
                        <p class="card-text text-muted small mb-0 mt-2" th:if="${!#lists.isEmpty(historico)}">
                            Última atualização: <span th:text="${#temporals.format(historico[historico.size() - 1].data_hora, 'dd/MM/yyyy HH:mm')}"></span>
                        </p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Histórico</h5>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between" th:each="item : ${historico}">
                                <span th:text="${item.descricao}"></span>
                                <span class="text-muted small" th:text="${#temporals.format(item.data_hora, 'dd/MM HH:mm')}"></span>
                            </li>
                            <li class="list-group-item text-center text-muted" th:if="${#lists.isEmpty(historico)}">
                                Nenhuma movimentação registrada ainda
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
