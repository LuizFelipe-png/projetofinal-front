<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Notificações</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/">Cliente</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="/rastreamento">Rastrear Encomenda</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/notificacoes">Notificações</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="container mt-5 mb-5">
            <h2 class="mb-1">Notificações</h2>
            <p class="text-muted mb-4">Acompanhe as atualizações sobre seus pedidos</p>
            <hr class="mb-4">
            <div class="card shadow-sm">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-start py-3"
                        th:each="item : ${notificacoes}">
                        <div>
                            <strong th:text="${item.descricao}"></strong>
                        </div>
                        <span class="text-muted small text-nowrap ms-3"
                              th:text="${#temporals.format(item.data_hora, 'dd/MM \'às\' HH:mm')}"></span>
                    </li>
                    <li class="list-group-item text-center text-muted py-4"
                        th:if="${#lists.isEmpty(notificacoes)}">
                        Nenhuma notificação no momento
                    </li>
                </ul>
            </div>
        </div>
    </body>
</html>
