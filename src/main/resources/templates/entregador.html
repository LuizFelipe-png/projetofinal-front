<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Entregador - Minhas Entregas</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body class="bg-light">

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="/entregador">Painel Entregador</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/entregador">Minhas Entregas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/entregador/incidentes">Registrar Incidente</a>
                        </li>
                    </ul>
                    <span class="navbar-text text-light me-3" th:text="${'Olá, ' + nomeUsuario}">Olá, Usuário</span>
                    <div class="d-flex">
                        <a href="/sair" class="btn btn-outline-light btn-sm">Sair</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container mt-5 mb-5">
            <h2 class="mb-1 fw-bold">Minhas Entregas</h2>
            <p class="text-muted mb-4">Gerencie o status da encomenda, registre pontos de parada ou confirme com o token</p>
            <hr class="mb-4">

            <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show shadow-sm text-center" role="alert">
                <span th:text="${mensagemSucesso}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${erroServidor}" class="alert alert-danger alert-dismissible fade show shadow-sm text-center" role="alert">
                <span th:text="${erroServidor}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row g-4">
                <div class="col-12" th:each="pedido : ${pedidos}">
                    <div class="card shadow border-0 rounded-4">
                        <div class="card-body p-4">

                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div>
                                    <span class="fw-bold fs-5 text-dark" th:text="${pedido.nome_pedido}"></span>
                                    <div class="text-muted small" th:text="${'Cliente: ' + pedido.nome_cliente}"></div>
                                    <div class="text-muted small" th:text="${'Código: ' + pedido.codigo}"></div>
                                </div>

                                <span th:class="${pedido.status == 'Entregue' ? 'badge bg-success px-3 py-2' : 
                                                (pedido.status == 'Avaria na Carga' || pedido.status == 'Incidente de Transporte' ? 'badge bg-danger px-3 py-2' : 'badge bg-warning text-dark px-3 py-2')}"
                                      th:text="${pedido.status}">
                                    Em Rota
                                </span>
                            </div>

                            <div th:if="${pedido.status != 'Entregue'}" class="row g-3 pt-2">
                                
                                <div class="col-lg-4 col-md-12">
                                    <form th:action="@{/entregador/atualizar-status}" method="post" class="d-flex gap-2">
                                        <input type="hidden" name="id_pedido" th:value="${pedido.id_pedido}">
                                        <select name="status" class="form-select form-select-sm" onchange="toggleToken(this)" required>
                                            <option value="" disabled>Alterar Status...</option>
                                            <option value="Pedido Solicitado" th:selected="${pedido.status == 'Pedido Solicitado'}">Pedido Solicitado</option>
                                            <option value="Em Produção" th:selected="${pedido.status == 'Em Produção'}">Em Produção</option>
                                            <option value="Disponivel para Despacho" th:selected="${pedido.status == 'Disponivel para Despacho'}">Disponivel para Despacho</option>
                                            <option value="Em Rota" th:selected="${pedido.status == 'Em Rota'}">Em Rota</option>
                                            <option value="Em Rota de Entrega" th:selected="${pedido.status == 'Em Rota de Entrega'}">Em Rota de Entrega</option>
                                            <option value="Entregue" th:selected="${pedido.status == 'Entregue'}">Entregue</option>
                                        </select>
                                        <button type="submit" class="btn btn-outline-primary btn-sm text-nowrap btn-atualizar">
                                            Atualizar
                                        </button>
                                    </form>
                                </div>

                                <div class="col-lg-4 col-md-12">
                                    <form th:action="@{/entregador/checkpoint}" method="post" class="d-flex gap-2">
                                        <input type="hidden" name="id_pedido" th:value="${pedido.id_pedido}">
                                        <input type="text"
                                               name="descricao"
                                               class="form-control form-control-sm"
                                               placeholder="Ex: Cheguei no CD de Curitiba"
                                               required>
                                        <button type="submit" class="btn btn-outline-dark btn-sm text-nowrap">
                                            Checkpoint
                                        </button>
                                    </form>
                                </div>

                                <div class="col-lg-4 col-md-12 div-token" style="display: none;">
                                    <form th:action="@{/entregador/confirmar}" method="post" class="d-flex gap-2">
                                        <input type="hidden" name="id_pedido" th:value="${pedido.id_pedido}">
                                        <input type="text"
                                               name="token"
                                               class="form-control form-control-sm"
                                               maxlength="10"
                                               placeholder="Token"
                                               required>
                                        <button type="submit" class="btn btn-success btn-sm fw-bold text-nowrap">
                                            Confirmar
                                        </button>
                                    </form>
                                </div>

                            </div>

                            <div th:if="${pedido.status == 'Entregue'}" class="text-success small fw-semibold pt-1">
                                ✓ Entrega finalizada
                            </div>

                        </div>
                    </div>
                </div>

                <div class="col-12" th:if="${#lists.isEmpty(pedidos)}">
                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-body text-center text-muted py-5">
                            Nenhuma entrega atribuída a você no momento.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function toggleToken(selectElement) {
                const row = selectElement.closest('.row');
                const divToken = row.querySelector('.div-token');
                const btnAtualizar = selectElement.nextElementSibling;
                
                if (selectElement.value === 'Entregue') {
                    divToken.style.display = 'block';
                    btnAtualizar.style.display = 'none';
                } else {
                    divToken.style.display = 'none';
                    btnAtualizar.style.display = 'block';
                }
            }
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
