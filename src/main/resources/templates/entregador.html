<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Painel do Entregador - Minhas Entregas</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="/entregador">🚚 Painel Entregador</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="/entregador">Minhas Entregas</a>
                        </li>
                    </ul>
                    <div class="d-flex">
                        <a href="/sair" class="btn btn-outline-light btn-sm">Sair</a>
                    </div>
                </div>
            </div>
        </nav>
        <div class="container mt-5 mb-5">
            <div class="text-center mb-5">
                <h2 class="fw-bold">Pedidos para Entrega</h2>
                <p class="text-muted">Confirme o recebimento junto ao cliente inserindo o token</p>
            </div>
            <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show shadow-sm text-center" role="alert">
                <span th:text="${mensagemSucesso}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${erroServidor}" class="alert alert-danger alert-dismissible fade show shadow-sm text-center" role="alert">
                <span th:text="${erroServidor}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-4">
                    <div th:if="${#lists.isEmpty(pedidos)}" class="text-center py-5 text-muted">
                        <h4>📦 Nenhuma entrega pendente!</h4>
                        <p>Você não possui pedidos pendentes para entregar no momento.</p>
                    </div>
                    <div th:if="${!#lists.isEmpty(pedidos)}" class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Pedido</th>
                                    <th>Cliente</th>
                                    <th>Ação (Confirmar Entrega)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="pedido : ${pedidos}">
                                    <td class="fw-bold" th:text="'#' + ${pedido.id_pedido != null ? pedido.id_pedido : pedido.id}"></td>
                                    <td th:text="${pedido.nome_pedido != null ? pedido.nome_pedido : 'Encomenda'}"></td>
                                    <td th:text="${pedido.nome_cliente != null ? pedido.nome_cliente : 'Cliente'}"></td>
                                    <td>
                                        <form th:action="@{/entregador/confirmar}" method="post" class="d-flex gap-2">
                                            <input type="hidden" name="id_pedido" th:value="${pedido.id_pedido != null ? pedido.id_pedido : pedido.id}" />
                                            <input type="text" 
                                                   name="token" 
                                                   class="form-control form-control-sm" 
                                                   placeholder="Digite o Token" 
                                                   required />
                                            <button type="submit" class="btn btn-success btn-sm text-nowrap fw-bold">
                                                Confirmar
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
