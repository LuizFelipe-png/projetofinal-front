<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entregador - Minhas Entregas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/entregador">Painel Entregador</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/entregador">Minhas Entregas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/entregador/incidentes">Registrar Incidente</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <a href="/sair" class="btn btn-outline-light btn-sm">Sair</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <h2 class="mb-1 fw-bold">Minhas Entregas</h2>
        <p class="text-muted mb-4">Registre pontos de parada ou confirme a entrega com o token do cliente</p>
        <hr class="mb-4">

        <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show shadow-sm text-center" role="alert">
            <span th:text="${mensagemSucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${erroServidor}" class="alert alert-danger alert-dismissible fade show shadow-sm text-center" role="alert">
            <span th:text="${erroServidor}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row g-4">
            <div class="col-12" th:each="pedido : ${pedidos}">
                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4">

                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div>
                                <span th:text="${pedido.nome_pedido}"></span>
                                <div class="text-muted small" th:text="${'Cliente: ' + pedido.nome_cliente}"></div>
                            </div>
                            <span th:class="${pedido.status == 'Entregue' ? 'badge bg-success px-3 py-2 fw-semibold' : 'badge bg-warning text-dark px-3 py-2 fw-semibold'}"
                                  th:text="${pedido.status}">Em Rota</span>
                        </div>

                        <div th:if="${pedido.status != 'Entregue'}" class="row g-3">

                            <div class="col-md-6">
                                <form th:action="@{/entregador/checkpoint}" method="post" class="d-flex gap-2">
                                    <input type="hidden" name="id_pedido" th:value="${pedido.id_pedido}">
                                    <input type="text"
                                           name="descricao"
                                           class="form-control form-control-sm"
                                           placeholder="Ex: Cheguei no CD de Curitiba"
                                           required>
                                    <button type="submit" class="btn btn-outline-dark btn-sm text-nowrap">
                                        Bater ponto
                                    </button>
                                </form>
                            </div>

                            <div class="col-md-6">
                                <form th:action="@{/entregador/confirmar}" method="post" class="d-flex gap-2">
                                    <input type="hidden" name="id_pedido" th:value="${pedido.id_pedido}">
                                    <input type="text"
                                           name="token"
                                           class="form-control form-control-sm"
                                           maxlength="5"
                                           placeholder="Token do cliente"
                                           style="max-width: 160px;"
                                           required>
                                    <button type="submit" class="btn btn-success btn-sm fw-bold text-nowrap">
                                        Confirmar Entrega
                                    </button>
                                </form>
                            </div>
                        </div>

                        <div th:if="${pedido.status == 'Entregue'}" class="text-success small fw-semibold">
                            ✓ Entrega concluída
                        </div>

                    </div>
                </div>
            </div>

            <div class="col-12" th:if="${#lists.isEmpty(pedidos)}">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body text-center text-muted py-5">
                        Nenhuma entrega atribuída a você no momento.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
