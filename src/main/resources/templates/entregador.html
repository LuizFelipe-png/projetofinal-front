<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Entregador</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="/entregador">Entregador</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/entregador">Minhas Entregas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/entregador/incidentes">Incidentes</a>
                        </li>
                    </ul>
                    <div class="d-flex">
                        <a href="/sair" class="btn btn-outline-light btn-sm">Sair</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container mt-5 mb-5">
            <h2 class="mb-1">Minhas Entregas</h2>
            <p class="text-muted mb-4">Cargas atribuídas a você</p>
            <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>
            <div th:if="${erroServidor}" class="alert alert-danger" th:text="${erroServidor}"></div>
            <hr class="mb-4">

            <!-- Lista informativa -->
            <div class="card mb-4">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item py-3" th:each="pedido : ${pedidos}">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span th:text="${pedido.nome_pedido}"></span>
                                <div class="text-muted small" th:text="${'Cliente: ' + pedido.nome_cliente}"></div>
                                <div class="text-muted small" th:if="${pedido.localizacao_atual}" th:text="${'Última localização: ' + pedido.localizacao_atual}"></div>
                            </div>
                            <span class="badge bg-secondary" th:text="${pedido.status}"></span>
                        </div>
                    </li>
                    <li class="list-group-item text-center text-muted py-4" th:if="${#lists.isEmpty(pedidos)}">
                        Nenhuma entrega atribuída no momento
                    </li>
                </ul>
            </div>

            <div th:if="${not #lists.isEmpty(pedidos)}">

                <!-- Confirmar entrega com token -->
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Confirmar entrega</h5>
                        <form th:action="@{/entregador/confirmar}" method="post" class="row g-2 align-items-end">
                            <div class="col-md-5">
                                <label class="form-label">Encomenda</label>
                                <select class="form-select" name="id_pedido" required>
                                    <option value="" selected disabled>Selecione a encomenda...</option>
                                    <option th:each="pedido : ${pedidos}"
                                            th:value="${pedido.id_pedido}"
                                            th:text="${pedido.nome_pedido + ' — ' + pedido.status}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Token</label>
                                <input type="text" class="form-control" name="token" maxlength="6" placeholder="Token" required>
                            </div>
                            <div class="col-md-3 d-grid">
                                <button type="submit" class="btn btn-dark">Confirmar</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Alterar status -->
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Alterar status</h5>
                        <form th:action="@{/entregador/atualizar-status}" method="post" class="row g-2 align-items-end">
                            <div class="col-md-5">
                                <label class="form-label">Encomenda</label>
                                <select class="form-select" name="id_pedido" required>
                                    <option value="" selected disabled>Selecione a encomenda...</option>
                                    <option th:each="pedido : ${pedidos}"
                                            th:value="${pedido.id_pedido}"
                                            th:text="${pedido.nome_pedido + ' — ' + pedido.status}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Novo status</label>
                                <select class="form-select" name="status" required>
                                    <option value="" selected disabled>Selecione...</option>
                                    <option value="Disponivel para Despacho">Disponível para Despacho</option>
                                    <option value="Em Rota">Em Rota</option>
                                    <option value="Entregue">Entregue</option>
                                    <option value="Avaria na Carga">Avaria na Carga</option>
                                    <option value="Incidente de Transporte">Incidente de Transporte</option>
                                </select>
                            </div>
                            <div class="col-md-3 d-grid">
                                <button type="submit" class="btn btn-outline-dark">Atualizar</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Bater ponto -->
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Bater ponto</h5>
                        <p class="text-muted small mb-3">Informa ao cliente onde a encomenda está no momento.</p>
                        <form th:action="@{/entregador/bater-ponto}" method="post" class="row g-2 align-items-end">
                            <div class="col-md-5">
                                <label class="form-label">Encomenda</label>
                                <select class="form-select" name="id_pedido" required>
                                    <option value="" selected disabled>Selecione a encomenda...</option>
                                    <option th:each="pedido : ${pedidos}"
                                            th:value="${pedido.id_pedido}"
                                            th:text="${pedido.nome_pedido + ' — ' + pedido.status}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Checkpoint</label>
                                <select class="form-select" name="localizacao" required>
                                    <option value="" selected disabled>Selecione...</option>
                                    <option value="Centro de Distribuição - Origem">Centro de Distribuição - Origem</option>
                                    <option value="Em Trânsito">Em Trânsito</option>
                                    <option value="Centro de Distribuição - Destino">Centro de Distribuição - Destino</option>
                                    <option value="Saiu para Entrega">Saiu para Entrega</option>
                                    <option value="Chegou ao Destino">Chegou ao Destino</option>
                                </select>
                            </div>
                            <div class="col-md-3 d-grid">
                                <button type="submit" class="btn btn-outline-dark">Bater ponto</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
