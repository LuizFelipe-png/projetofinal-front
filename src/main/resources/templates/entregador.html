<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Entregador</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="/entregador">Entregador</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/entregador">Minhas Entregas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/entregador/incidentes">Incidentes</a>
                        </li>
                    </ul>
                    <div class="d-flex">
                        <a href="/sair" class="btn btn-outline-light btn-sm">Sair</a>
                    </div>
                </div>
            </div>
        </nav>
        <div class="container mt-5 mb-5">
            <h2 class="mb-1">Minhas Entregas</h2>
            <p class="text-muted mb-4">Cargas atribuídas a você</p>
            <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>
            <div th:if="${erroServidor}" class="alert alert-danger" th:text="${erroServidor}"></div>
            <hr class="mb-4">
            <div class="card">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item py-3" th:each="pedido : ${pedidos}">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <div>
                                <span th:text="${pedido.nome_pedido}"></span>
                                <div class="text-muted small" th:text="${'Cliente: ' + pedido.nome_cliente}"></div>
                            </div>
                            <span class="badge bg-secondary" th:text="${pedido.status}"></span>
                        </div>

                        <div th:if="${pedido.status == 'Em Rota'}">
                            <form th:action="@{/entregador/confirmar}" method="post" class="row g-2 align-items-center mt-2">
                                <input type="hidden" name="id_pedido" th:value="${pedido.id_pedido}">
                                <div class="col-auto">
                                    <input type="text" class="form-control" name="token" maxlength="5" placeholder="Token" style="width: 160px;" required>
                                </div>
                                <div class="col-auto">
                                    <button type="submit" class="btn btn-primary btn-sm">Confirmar entrega</button>
                                </div>
                            </form>

                            <form th:action="@{/entregador/atualizar-status}" method="post" class="row g-2 align-items-center mt-2">
                                <input type="hidden" name="id_pedido" th:value="${pedido.id_pedido}">
                                <div class="col-auto">
                                    <select class="form-select" name="status" style="width: 220px;" required>
                                        <option value="" selected disabled>Alterar status...</option>
                                        <option value="Pedido Solicitado">Pedido Solicitado</option>
                                        <option value="Em Produção">Em Produção</option>
                                        <option value="Disponivel para Despacho">Disponível para Despacho</option>
                                        <option value="Em Rota">Em Rota</option>
                                        <option value="Entregue">Entregue</option>
                                        <option value="Avaria na Carga">Avaria na Carga</option>
                                        <option value="Incidente de Transporte">Incidente de Transporte</option>
                                    </select>
                                </div>
                                <div class="col-auto">
                                    <button type="submit" class="btn btn-outline-secondary btn-sm">Atualizar</button>
                                </div>
                            </form>
                        </div>
                    </li>
                    <li class="list-group-item text-center text-muted py-4" th:if="${#lists.isEmpty(pedidos)}">
                        Nenhuma entrega atribuída no momento
                    </li>
                </ul>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
