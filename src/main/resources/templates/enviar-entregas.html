    <!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indústria - Enviar Entregas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/industria">Painel Indústria</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/industria">Meus Pedidos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/industria/enviar-tela">Enviar para Entregador</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <h2 class="mb-1">Despachar Encomendas</h2>
        <p class="text-muted mb-4">Atribua os pedidos prontos aos entregadores disponíveis</p>
        <hr class="mb-4">

        <div class="row g-4 justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-white py-3 text-center">
                        <h5 class="card-title mb-0 fw-semibold text-dark">Atribuir Carga ao Entregador</h5>
                    </div>
                    <div class="card-body p-4">
                        
                        <form th:action="@{/industria/vincular}" method="post">
                            
                            <div class="mb-3">
                                <label for="id_pedido" class="form-label fw-medium">Qual pedido deseja enviar?</label>
                                <select class="form-select" id="id_pedido" name="id_pedido" required>
                                    <option value="" disabled selected>Selecione um pedido pendente...</option>
                                    <option th:each="pedido : ${listaPedidos}" 
                                            th:value="${pedido.id_pedido}" 
                                            th:text="' ' + ${pedido.nome_pedido} + ' (Cliente: ' + ${pedido.nome_cliente} + ')'">
                                    </option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label for="id_entregador" class="form-label fw-medium">Quem será o entregador?</label>
                                <select class="form-select" id="id_entregador" name="id_entregador" required>
                                    <option value="" disabled selected>Selecione um motorista...</option>
                                    <option th:each="entregador : ${entregadores}" 
                                            th:value="${entregador.id}" 
                                            th:text="'🚚 ' + ${entregador.nome}">
                                    </option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-dark w-100 fw-medium shadow-sm py-2">
                                Confirmar Envio
                            </button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
